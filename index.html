<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Kırılmasın! · Oyun kapandı</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#5b3a14 0,#2a1a08 75%);color:#fff8ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .egg{width:96px;height:120px;margin:0 auto 14px;background:radial-gradient(circle at 35% 30%,#fffdf7,#f6e9d2 60%,#d9c4a2);border-radius:50% 50% 46% 46%/58% 58% 42% 42%;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  h1{margin:0 0 8px;font-size:clamp(1.8rem,7vw,2.6rem);color:#ffd23f;text-shadow:0 3px 0 #7a4a05}
  p{margin:0 auto 10px;max-width:420px;line-height:1.5;color:#f3dcb4}
  small{display:block;margin-top:18px;color:#c9a97a}
</style>
</head>
<body>
<main>
  <div>
    <div class="egg" aria-hidden="true"></div>
    <h1>Kırılmasın! kapandı</h1>
    <p>Oyunu oynayan, yumurta fırlatan, civciv toplayan herkese çok teşekkürler 🥚</p>
    <p>Ana ekrana eklediysen simgeyi silebilirsin.</p>
    <small>MERT GAMES</small>
  </div>
</main>
<script>
// Eski sürümün çevrimdışı önbelleğini ve kayıtlı servis çalışanını temizle
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}catch(e){}
try{if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}catch(e){}
</script>
</body>
</html>
